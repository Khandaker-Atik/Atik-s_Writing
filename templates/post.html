{% extends "base.html" %}

{% block content %}
<style>
    .notebook-container {
        max-width: 800px;
        margin: 40px auto;
        background: #fff;
        padding: 0;
        box-shadow: 0 3px 15px rgba(0,0,0,0.2);
        position: relative;
        border-radius: 0 0 5px 5px;
    }

    /* Red margin line on the left */
    .notebook-container::before {
        content: '';
        position: absolute;
        left: 40px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: #ff6b6b;
    }

    /* Notebook header */
    .notebook-header {
        background: #ff6b6b;
        color: white;
        padding: 15px 30px;
        font-family: 'Courier New', monospace;
        font-size: 24px;
        text-align: center;
        border-radius: 5px 5px 0 0;
    }

    /* Form styling */
    .notebook-form {
        padding: 30px 60px;
        background-image: linear-gradient(#e5e5e5 1px, transparent 1px);
        background-size: 100% 2rem;
        line-height: 2rem;
    }

    .form-group {
        margin-bottom: 2rem;
        position: relative;
    }

    /* Labels styling */
    .notebook-form label {
        font-family: 'Courier New', monospace;
        color: #2c3e50;
        font-weight: bold;
        font-size: 18px;
        margin-bottom: 10px;
        display: block;
    }

    /* Input and textarea styling */
    .notebook-form input,
    .notebook-form textarea {
        width: 100%;
        padding: 10px;
        border: none;
        background: transparent;
        font-family: 'Comic Sans MS', cursive;
        font-size: 16px;
        line-height: 2rem;
        color: #34495e;
        border-bottom: 2px solid #bdc3c7;
        transition: border-color 0.3s;
    }

    .notebook-form input:focus,
    .notebook-form textarea:focus {
        outline: none;
        border-bottom-color: #3498db;
    }

    /* Button styling */
    .notebook-btn {
        background: #3498db;
        color: white;
        border: none;
        padding: 12px 25px;
        font-family: 'Courier New', monospace;
        font-size: 16px;
        border-radius: 25px;
        cursor: pointer;
        transition: transform 0.2s, background 0.2s;
        margin-top: 20px;
    }

    .notebook-btn:hover {
        background: #2980b9;
        transform: translateY(-2px);
    }

    /* Back button styling */
    .btn-back {
        display: inline-block;
        padding: 10px 20px;
        background: #95a5a6;
        color: white;
        text-decoration: none;
        border-radius: 25px;
        font-family: 'Courier New', monospace;
        margin-top: 20px;
        transition: background 0.2s;
    }

    .btn-back:hover {
        background: #7f8c8d;
        text-decoration: none;
        color: white;
    }

    /* Paper clip decoration */
    .paper-clip {
        position: absolute;
        top: -10px;
        right: 20px;
        width: 50px;
        height: 80px;
        background: #95a5a6;
        clip-path: path('M 0 20 C 0 10, 10 0, 20 0 L 30 0 C 40 0, 50 10, 50 20 L 50 60 C 50 70, 40 80, 30 80 L 20 80 C 10 80, 0 70, 0 60 Z');
        transform: rotate(45deg);
    }
</style>

<div class="notebook-container">
    <div class="paper-clip"></div>
    <div class="notebook-header">
        {% if post %}
            Edit Entry
        {% else %}
            New Entry
        {% endif %}
    </div>

    <form action="{{ url_for('edit_post', post_id=post.id) if post else url_for('new_post') }}" method="POST" class="notebook-form">
        {{ form.hidden_tag() }}

        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" value="{{ form.title.data if post else '' }}" required>
        </div>
        
        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" name="content" rows="8" required>{{ form.content.data if post else '' }}</textarea>
        </div>
                
        <button type="submit" class="notebook-btn">
            {% if post %}
                Save Changes
            {% else %}
                Create Entry
            {% endif %}
        </button>
    </form>

    {% if post %}
        <a href="{{ url_for('view_post', post_id=post.id) }}" class="btn-back">Back to Entry</a>
    {% else %}
        <a href="{{ url_for('home') }}" class="btn-back">Back to Journal</a>
    {% endif %}
</div>
{% endblock %}
