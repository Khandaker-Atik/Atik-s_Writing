{% extends "base.html" %}
{% block content %}
    <h1>New Post</h1>
    <form method="POST" action="{{ url_for('new_post') }}">
        {{ form.hidden_tag() }}
        <div>
            {{ form.title.label }}<br>
            {{ form.title(size=64) }}
        </div>
        <div>
            {{ form.content.label }}<br>
            {{ form.content(rows=10, cols=40) }}
        </div>
        <div>
            {{ form.submit() }}
        </div>
    </form>
{% endblock %}
